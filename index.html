<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 이름</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f7f5f0; --fg: #1a1a1a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #f2f2f2; } }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: "Noto Sans KR", system-ui, sans-serif;
      padding: 0 16px; box-sizing: border-box; overflow-x: hidden;
    }
    h1 {
      margin: 0; font-weight: 900; text-align: center;
      font-size: clamp(4rem, 22vw, 18rem);
      line-height: 1; letter-spacing: -0.02em; word-break: keep-all;
    }
  </style>
</head>
<body>
  <h1 id="name">홍길동</h1>
  <script>
    // 여기 기본 이름을 바꾸거나, 주소 뒤에 ?name=이름 을 붙여 표시할 수 있습니다.
    const DEFAULT_NAME = "홍길동";
    const name = new URLSearchParams(location.search).get("name") || DEFAULT_NAME;
    document.getElementById("name").textContent = name;
    document.title = name;
  </script>
</body>
</html>
